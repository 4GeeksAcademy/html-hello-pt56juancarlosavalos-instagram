<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram PT 56 Avalos</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* Header */
    .instagram-header {
      background-color: white;
      border-bottom: 1px solid #dbdbdb;
      padding: 8px 0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .instagram-logo {
      font-size: 24px;
      font-weight: bold;
      color: #262626;
      text-decoration: none;
    }

    /* Botón Create post */
    .btn-create-post {
      background-color: #0095f6;
      border: none;
      border-radius: 8px;
      color: white;
      padding: 8px 16px;
      font-weight: 600;
    }
    .btn-create-post:hover {
      background-color: #1877f2;
      color: white;
    }

    /* Grid view */
    .grid-view .image-item {
      aspect-ratio: 1;
      overflow: hidden;
      margin-bottom: 3px;
    }
    .grid-view .image-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Feed view */
    .feed-view .post-item {
      background: white;
      border: 1px solid #dbdbdb;
      border-radius: 8px;
      margin-bottom: 24px;
      max-width: 600px;
      margin: 0 auto 24px auto;
    }
    .feed-view .post-header {
      padding: 16px;
      border-bottom: 1px solid #efefef;
    }
    .feed-view .post-title {
      font-weight: 600;
      font-size: 16px;
      margin: 0;
    }
    .feed-view .post-date {
      color: #8e8e8e;
      font-size: 12px;
    }
    .feed-view .post-footer {
      padding: 16px;
    }
    .post-likes {
      font-weight: 600;
      margin-bottom: 8px;
    }
    .post-description {
      font-size: 14px;
      color: #262626;
    }

    /* Modal */
    .caption-input {
      border: 1px solid #dbdbdb;
      border-radius: 6px;
      padding: 12px;
      resize: vertical;
      min-height: 100px;
    }
    .btn-publish {
      background-color: #0095f6;
      border: none;
      color: white;
      padding: 8px 24px;
      border-radius: 6px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="instagram-header">
    <div class="container-fluid">
      <div class="row align-items-center">
        <div class="col-6">
          <a href="#" class="instagram-logo">
            <i class="fab fa-instagram me-2"></i>Instagram
          </a>
        </div>
        <div class="col-6 text-end">
          <!-- Botón Modal -->
          <button class="btn btn-create-post me-2" data-bs-toggle="modal" data-bs-target="#createPostModal">
            Create a new post
          </button>
          <!-- Dropdown -->
          <div class="dropdown d-inline-block">
            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
              <i class="fas fa-cog"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="#">Profile</a></li>
              <li><a class="dropdown-item" href="#">Accessibility</a></li>
              <li><a class="dropdown-item" href="#">Privacy and Data</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger" href="#">Log out</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Tabs (para cambiar vistas) -->
  <ul class="nav nav-tabs justify-content-center mt-3" id="viewTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="grid-tab" data-bs-toggle="tab" data-bs-target="#gridView" type="button" role="tab">
        <i class="fas fa-th"></i> Grid
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="feed-tab" data-bs-toggle="tab" data-bs-target="#feedView" type="button" role="tab">
        <i class="fas fa-square"></i> Feed
      </button>
    </li>
  </ul>

  <!-- Contenido de Tabs -->
  <div class="tab-content mt-3" id="viewTabsContent">
    <!-- Grid -->
    <div class="tab-pane fade show active grid-view" id="gridView" role="tabpanel">
      <div class="container-fluid">
        <div class="row">
          <div class="col-4"><div class="image-item"><img src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=500&q=80" alt="Happy dog"></div></div>
          <div class="col-4"><div class="image-item"><img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=500&q=80" alt="Group of friends"></div></div>
          <div class="col-4"><div class="image-item"><img src="https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?auto=format&fit=crop&w=500&q=80" alt="Croatia coastline"></div></div>
        </div>
      </div>
    </div>

    <!-- Feed -->
    <div class="tab-pane fade feed-view" id="feedView" role="tabpanel">
      <div class="post-item">
        <div class="post-header">
          <h3 class="post-title">My Crazy dog Spark!</h3>
          <div class="post-date">04/26</div>
        </div>
        <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=600&q=80" alt="Happy dog" class="post-image w-100">
        <div class="post-footer">
          <div class="post-likes">204 Likes</div>
          <div class="post-description">This is an example caption for Instagram</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="createPostModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Create a new post</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <label class="form-label">Caption:</label>
          <textarea class="form-control caption-input" placeholder="Add the caption of your post here"></textarea>
          <div class="d-flex gap-2 mt-3">
            <button class="btn btn-outline-secondary"><i class="fas fa-camera"></i></button>
            <button class="btn btn-outline-secondary"><i class="fas fa-map-marker-alt"></i></button>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn-publish">Publish</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
</body>
</html>
